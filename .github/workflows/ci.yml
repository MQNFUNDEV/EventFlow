name: EventFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - chatgpt/phase-1-2-cleanup

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report npm audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const fs = require("node:fs"); try { const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8")); const items = Object.entries(audit.vulnerabilities || {}); const total = audit.metadata?.vulnerabilities?.total ?? 0; console.log("npm audit: " + total + " total vulnerabilities"); for (const [name, item] of items) console.log(name + ": " + item.severity + ", direct=" + item.isDirect + ", fixAvailable=" + JSON.stringify(item.fixAvailable)); } catch { console.log("npm audit report unavailable; check registry/network logs."); }'
      - name: Run ESLint
        run: npm run lint
      - name: Build production frontend
        run: npm run build
